[project]
name = "vetsoft"
version = "0.1.0"
description = "Sistema de gestión de vacunación para veterinaria. Proyecto demostración MPII"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 88
