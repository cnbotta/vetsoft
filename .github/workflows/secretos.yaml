name: Secretos

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Buscar credenciales en el código
    runs-on: ubuntu-24.04   # fijamos la versión: ubuntu-latest pasa a Ubuntu 26 el 19/10/2026
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # sin el historial completo solo se ve el último commit

      - name: Buscar credenciales (gitleaks)
        uses: gitleaks/gitleaks-action@v3   # v2 corre en Node 20, ya deprecado
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
