name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Pruebas y estilo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Instalar uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --locked --all-extras --dev

      - name: Estilo (ruff)
        run: uv run ruff check .

      - name: Pruebas
        run: uv run pytest -q